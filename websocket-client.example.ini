; Configuration for the standalone host (node host/index.mjs).
; Copy to websocket-client.ini and edit.

[websocket]
; Where your application's websocket server is listening.
address = 127.0.0.1
port = 9090
endpoint = /
; Connect as soon as the client is injected.
startOnLaunch = true
; Retry automatically when the server goes away, backing off from reconnectDelayMs and
; doubling up to reconnectMaxDelayMs. Retries continue indefinitely.
reconnect = true
reconnectDelayMs = 1000
reconnectMaxDelayMs = 30000

[spotify]
; Remote debugging port the host uses to talk to Spotify.
debugPort = 9223
; Spotify enforces a single instance, so enabling the debug port on an already-running
; client requires restarting it. Set to false to fail instead of restarting.
restart = true
; Optional explicit path; autodetected when omitted.
; executable = C:\Users\you\AppData\Roaming\Spotify\Spotify.exe
